<div class="ib-setup-warning ib-dialog">
    <div class="ib-permission-switches">
        {{#each permissions}}
        <label class="ib-permission-switch {{#if this.enabled}}is-on{{else}}is-off{{/if}}">
            <input type="checkbox" data-permission="{{this.key}}" {{#if this.enabled}}checked{{/if}}>
            <span class="ib-switch-text">
                <span class="ib-switch-title">
                    <strong>{{this.label}}</strong>
                    {{#if this.recommended}}<span class="ib-badge recommended">Recommended</span>{{/if}}
                </span>
                <small>{{this.hint}}</small>
            </span>
        </label>
        {{/each}}
    </div>

    <div class="ib-dialog-buttons">
        <button type="button" class="ib-btn ok" data-action="dismiss">
            <i class="fas fa-check"></i> Done
        </button>
        <button type="button" class="ib-btn disable" data-action="disableWarning" data-tooltip="Don't show again">
            <i class="fas fa-bell-slash"></i>
        </button>
    </div>
</div>
